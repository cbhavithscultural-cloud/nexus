<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Nexus</title>
<style>:root{--bg:#0e1822;--pn:#15232f;--ink:#e8eef2;--mu:#9aabb7;--ln:#2a3d4d;--ac:#4fb3a6}@media(prefers-color-scheme:light){:root{--bg:#f2f5f6;--pn:#fff;--ink:#13202a;--mu:#52626d;--ln:#c9d5dc;--ac:#14776a}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,serif;max-width:860px;margin-inline:auto;padding:20px}h1,h2,button{font-family:system-ui,sans-serif}
.p{background:var(--pn);border:1px solid var(--ln);border-top:3px solid var(--ac);border-radius:6px;padding:12px 16px;margin:12px 0}.mu{color:var(--mu);font-size:.9rem}button{border:1px solid var(--ln);background:none;color:var(--ink);padding:6px 10px;margin:2px;cursor:pointer}button[aria-pressed=true]{background:var(--ac);color:#0b1519}a{color:var(--ac)}details>summary{cursor:pointer}</style></head><body>
<h1>Project Nexus</h1><div id="hd" class="mu">Loading today's update…</div><div id="app"></div>
<script>
const T={news:"Robotics Discovery Center",jobs:"Careers and internship intelligence",oi_lesson:"Organoid Intelligence: today's lesson",bci_lesson:"Brain-Computer Interface: today's lesson",oi_paper:"OI paper investigation",bci_paper:"BCI paper investigation",github:"GitHub Robotics Laboratory",internship:"Internship Academy",linkedin:"LinkedIn improvement"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function R(v,k){if(v==null)return"";if(Array.isArray(v))return v.map(x=>`<div class="p">${R(x)}</div>`).join("");if(typeof v==="object")return Object.entries(v).map(([a,b])=>`<div><b>${esc(a.replace(/_/g," "))}</b> ${R(b,a)}</div>`).join("");const s=String(v);return /^https:\/\//.test(s)?`<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(s)}</a>`:`<span>${esc(s)}</span>`}
let st={};try{st=JSON.parse(localStorage.getItem("nxp")||"{}")}catch(e){}
fetch("data/latest.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
$("hd").innerHTML=`Updated ${esc(d.generated_at)} (IST). Failed sections keep their last good content.`;
$("app").innerHTML=Object.keys(T).map(k=>{const s=d.sections[k],ok=d.status[k];const key=d.date+k;return `<section class="p"><h2>${T[k]}</h2><div class="mu">Run status: ${esc(ok||"missing")}</div>${s?R(s):'<p class="mu">No content yet for this section.</p>'}<div>${["Completed","Partly done","Skipped","Postponed"].map(l=>`<button data-k="${key}" data-l="${l}" aria-pressed="${st[key]===l}">${l}</button>`).join("")}</div></section>`}).join("");
$("app").onclick=e=>{const b=e.target.closest("button");if(!b)return;st[b.dataset.k]=b.dataset.l;try{localStorage.setItem("nxp",JSON.stringify(st))}catch(x){}b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))}}).catch(()=>{$("hd").textContent="No data published yet. Run the daily-update workflow once."});
function $(i){return document.getElementById(i)}
</script></body></html>
