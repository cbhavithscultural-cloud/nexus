<style>

.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(22px);background:#080c18c9;border-bottom:1px solid var(--line)}.topinner{max-width:var(--max);margin:auto;padding:12px 26px;display:flex;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:12px;min-width:max-content}.brandmark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#65f0e0,#7d9cff 62%,#c09bff);color:#07111c;font-weight:950;letter-spacing:-.08em;box-shadow:0 0 32px #65f0e02c}.brandtext strong{display:block;font-size:14px;letter-spacing:.18em}.brandtext span{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.topstatus{display:flex;align-items:center;gap:9px;margin-left:auto;color:var(--muted);font-size:12px}.live-dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 0 5px #8df0b218;animation:pulse 2s infinite}.iconbtn,.primary,.secondary,.navbtn,.smallbtn{border:1px solid var(--line);border-radius:12px;background:#ffffff06;color:var(--ink);transition:transform .2s,border-color .2s,background .2s}.iconbtn{width:40px;height:40px;display:grid;place-items:center;font-size:18px}.iconbtn:hover,.secondary:hover,.smallbtn:hover{border-color:#65f0e080;background:#65f0e010}.primary{padding:11px 16px;background:linear-gradient(120deg,#65f0e0,#8ce5e5);color:#07111b;font-weight:800;border:0;box-shadow:0 9px 25px #65f0e01b}.primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px #65f0e035}.secondary{padding:10px 14px}.smallbtn{padding:7px 10px;font-size:12px}.wrap{max-width:var(--max);margin:0 auto;padding:30px 26px 70px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:26px}.sidebar{position:sticky;top:83px;align-self:start;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);backdrop-filter:blur(18px);padding:16px;box-shadow:var(--shadow)}.side-label{color:#7182a9;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;padding:9px 10px}.navlist{display:grid;gap:5px}.navbtn{width:100%;display:flex;align-items:center;gap:11px;padding:10px;border-color:transparent;background:transparent;text-align:left;color:var(--muted);font-size:13px}.navbtn:hover{background:#ffffff07;color:var(--ink)}.navbtn.active{background:linear-gradient(100deg,#65f0e014,#7d9cff0b);border-color:#65f0e02b;color:var(--ink)}.navico{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#ffffff08;font-size:15px}.navbtn.active .navico{background:#65f0e01c;color:var(--cyan)}.navlabel{flex:1}.navmins{font-size:10px;color:#8190b0}.sidecard{margin-top:18px;padding:15px;border-radius:16px;border:1px solid #65f0e01e;background:linear-gradient(135deg,#65f0e00c,#7d9cff0b)}.sidecard h3{margin:0 0 5px;font-size:12px;letter-spacing:.06em}.sidecard p{font-size:12px;color:var(--muted);margin:0 0 12px}.progressline{height:6px;background:#ffffff10;border-radius:99px;overflow:hidden}.progressline span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--violet));border-radius:99px;transition:width .6s}.sidefoot{padding:16px 10px 2px;color:#7182a9;font-size:11px}

gap:14px;margin:30px 0 14px}.sectionhead p{margin:0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{min-width:0;position:relative;border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:20px;box-shadow:0 12px 40px #0000000d;transition:transform .25s,border-color .25s,background .25s;animation:reveal .45s ease both}.card:hover{transform:translateY(-3px);border-color:#9eb8ff38;background:var(--panel2)}.cardhead{display:flex;gap:13px;align-items:flex-start;margin-bottom:14px}.cardicon{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;font-size:20px;background:#65f0e013;border:1px solid #65f0e021}.cardhead h3{margin:2px 0 4px}.cardhead p{font-size:12px;color:var(--muted);margin:0}.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:10px;color:var(--muted);font-weight:750;letter-spacing:.04em}.tag.cyan{color:var(--cyan);border-color:#65f0e032;background:#65f0e00b}.tag.gold{color:var(--gold);border-color:#ffc97935;background:#ffc9790b}.tag.violet{color:var(--violet);border-color:#c09bff35;background:#c09bff0b}.card p{color:#c2cce3;font-size:13px}.card .cardfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:13px;margin-top:16px}.contentblock{border:1px solid var(--line);background:#080d1b55;border-radius:15px;padding:15px;margin:12px 0}.contentblock h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}.contentblock p:last-child{margin-bottom:0}.contentblock ul,.contentblock ol{padding-left:21px;margin:6px 0;color:#c5cee5}.contentblock li{padding:3px 0}.checklist{display:grid;gap:9px}.checkitem{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:13px;padding:12px;background:#ffffff03}.checkitem input{margin-top:6px;accent-color:var(--cyan)}.checkitem span{flex:1}.qa{border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}.qa summary{cursor:pointer;padding:13px 15px;font-weight:700;font-size:13px}.qa .answer{padding:0 15px 15px;color:var(--muted);font-size:13px}.notice{border:1px solid #ffc97935;background:#ffc9790b;color:#f4d8a5;border-radius:14px;padding:13px 15px;font-size:12px;margin:14px 0}.goodnotice{border:1px solid #8df0b22c;background:#8df0b208;color:#b8f8ce;border-radius:14px;padding:13px 15px;font-size:12px;margin:14px 0}.paperlink,.outlink{display:inline-flex;gap:7px;align-items:center;font-size:12px;font-weight:750}.itemlist{display:grid;gap:12px}.feeditem{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:18px}.feeditem h3{font-size:17px;margin:10px 0}.feedmeta{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.feeditem p{color:#c0cbe3;font-size:13px}.feeditem .feedgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feeditem .feedgrid div{border-top:1px solid var(--line);padding-top:9px;font-size:12px;color:var(--muted)}.feeditem .feedgrid strong{display:block;color:#e5ebff;margin-bottom:4px}.empty{border:1px dashed #9ba8c83d;border-radius:17px;padding:24px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:6px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{min-width:190px;flex:1;border:1px solid var(--line);border-radius:12px;background:#090e1e;color:var(--ink);padding:10px 12px}.pillrow{display:flex;flex-wrap:wrap;gap:7px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:#ffffff05;color:var(--muted);font-size:11px}.pill.active{color:var(--cyan);border-color:#65f0e045;background:#65f0e012}.dailyhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.dailyhead h1{font-size:clamp(28px,3.4vw,42px)}.datebadge{flex:none;border:1px solid var(--line);background:var(--panel);padding:11px 14px;border-radius:14px;color:var(--muted);font-size:12px}.two-col{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(240px,.7fr);gap:14px}.completion{display:flex;align-items:center;gap:12px}.completion .ring{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) var(--pct,0%),#ffffff13 0);position:relative;font-weight:850;font-size:12px}.completion .ring:before{content:"";position:absolute;inset:5px;background:#10172a;border-radius:50%}.completion .ring span{z-index:1}.footnote{color:#7280a2;font-size:11px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}.toast{position:fixed;right:20px;bottom:20px;z-index:50;padding:13px 16px;border-radius:13px;border:1px solid #65f0e044;background:#111a2e;color:var(--ink);box-shadow:var(--shadow);max-width:min(380px,calc(100vw - 40px));animation:reveal .25s ease}.mobilemenu{display:none}
@media(max-width:1100px){.wrap{grid-template-columns:215px minmax(0,1fr);gap:18px;padding-inline:18px}.topinner{padding-inline:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr .7fr}}@media(max-width:800px){.wrap{display:block;padding:18px 14px 50px}.sidebar{position:relative;top:auto;margin-bottom:17px;padding:9px}.side-label,.sidecard,.sidefoot{display:none}.navlist{display:flex;overflow:auto;gap:5px;padding-bottom:2px}.navbtn{width:auto;flex:none;padding:7px 9px}.navlabel{white-space:nowrap}.navmins{display:none}.navico{width:26px;height:26px}.hero{grid-template-columns:1fr;min-height:0}.hero-art{max-width:245px;grid-row:1}.hero h1{font-size:37px}.grid{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.topstatus{display:none}.brand{min-width:0}.brandtext span{display:none}.topinner{gap:10px}.dailyhead{display:block}.datebadge{display:inline-block;margin-bottom:10px}.feeditem .feedgrid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}.hero{padding:22px}.hero h1{font-size:32px}.card{padding:16px}.topinner{padding-inline:12px}.brandtext strong{font-size:12px;letter-spacing:.12em}.iconbtn{width:36px;height:36px}.feeditem .feedgrid{grid-template-columns:1fr}.sectionhead{align-items:flex-start;flex-direction:column}}

<body><div id="universe" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<header class="topbar"><div class="topinner"><div class="brand"><div class="brandmark">N</div><div class="brandtext"><strong>NEXUS</strong><span>Living Intelligence Academy</span></div></div><div class="topstatus"><span class="live-dot"></span><span id="syncstatus">Connecting to daily knowledge</span></div><button class="iconbtn" id="refreshBtn" title="Refresh learning data" aria-label="Refresh learning data">↻</button><button class="primary" id="continueBtn">Continue learning&nbsp; ↗</button></div></header>
<div class="wrap"><aside class="sidebar"><div class="side-label">Learning systems</div><nav class="navlist" id="nav" aria-label="Learning departments"></nav><div class="sidecard"><h3>YOUR 365-DAY ARC</h3><p>Small daily progress. Compounding technical depth.</p><div class="progressline"><span id="sideProgress" style="width:0%"></span></div><p style="margin:9px 0 0"><b id="sideDone">0</b> of 365 days tracked</p></div><div class="sidefoot">NEXUS ACADEMY · BUILD 2.0</div></aside><main id="main" aria-live="polite"><div class="empty">Loading your learning systems…</div></main></div><div id="toast" class="toast" role="status" hidden></div>
<script>
(() => {
'use strict';
const DEPTS=[{id:'home',label:'Mission Control',icon:'⌁',mins:0,color:'cyan'},{id:'oi',label:'Organoid Intelligence',icon:'◉',mins:30,color:'cyan'},{id:'bci',label:'Brain–Computer Interfaces',icon:'⌁',mins:30,color:'gold'},{id:'gh',label:'GitHub Robotics Lab',icon:'⌘',mins:15,color:'blue'},{id:'li',label:'LinkedIn & Careers',icon:'↗',mins:15,color:'pink'},{id:'ip',label:'Internship Academy',icon:'⚙',mins:15,color:'violet'},{id:'rd',label:'Discovery Center',icon:'✳',mins:15,color:'green'},{id:'progress',label:'Progress & Notes',icon:'▤',mins:0,color:'blue'}];
const SECTIONS={oi:['oi_lesson','oi_paper'],bci:['bci_lesson','bci_paper'],gh:['github'],li:['linkedin','jobs'],ip:['internship'],rd:['news','jobs']};
const LABELS={oi_lesson:'Today’s lesson',bci_lesson:'Today’s lesson',oi_paper:'Research paper investigation',bci_paper:'Research paper investigation',github:'Project investigation',linkedin:'Career intelligence',internship:'Practical session',news:'Robotics intelligence',jobs:'Engineering opportunities'};
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>Array.isArray(v)?v:[];const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};const text=v=>typeof v==='string'?v:'';const safeUrl=v=>{try{const u=new URL(v);return ['https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}};
const STORAGE='nexus-academy-v3';let store={done:{},notes:{},saved:[],history:[]};try{const x=JSON.parse(localStorage.getItem(STORAGE)||'{}');store={...store,...obj(x)}}catch{};let data=null,current='home',toastTimer=null;
const todayIST=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const dayKey=todayIST();store.done[dayKey]=obj(store.done[dayKey]);
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(store))}catch{showToast('Browser storage is full; export your notes before clearing data.')}}
function showToast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2800)}
function completedCount(){return Object.values(store.done).reduce((n,d)=>n+Object.values(obj(d)).filter(Boolean).length,0)}
function sectionDone(key){return !!obj(store.done[dayKey])[key]}
function setDone(key,val){store.done[dayKey][key]=val;persist();renderNav();render()}
function navRender(){const nav=$('#nav');nav.innerHTML=DEPTS.map(d=>`<button class="navbtn ${current===d.id?'active':''}" data-nav="${d.id}" aria-current="${current===d.id?'page':'false'}"><span class="navico">${d.icon}</span><span class="navlabel">${esc(d.label)}</span>${d.mins?`<span class="navmins">${d.mins}m</span>`:''}</button>`).join('');nav.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));const days=Math.min(365,completedCount());$('#sideDone').textContent=days;$('#sideProgress').style.width=(days/365*100)+'%'}
function go(id){current=id;navRender();render();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function labelStatus(s){return text(s).toLowerCase().includes('failed')?'Needs retry':text(s).toLowerCase().includes('unverified')?'Unverified':'Generated'}
function confidenceTag(s){const v=text(s);if(/unverified|not read|preliminary|single-source|metadata only/i.test(v))return `<span class="tag gold">⚠ ${esc(v.length>50?v.slice(0,47)+'…':v||'Check source')}</span>`;return `<span class="tag cyan">✓ ${esc(v||'Review source')}</span>`}
function field(title,content){if(!content)return '';let body;if(Array.isArray(content))body='<ul>'+content.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';else body=`<p>${esc(content).replace(/\n/g,'<br>')}</p>`;return `<section class="contentblock"><h3>${esc(title)}</h3>${body}</section>`}
function taskBox(key,label){return `<label class="checkitem"><input type="checkbox" data-complete="${esc(key)}" ${sectionDone(key)?'checked':''}><span><b>${esc(label)}</b><br><small class="muted">${sectionDone(key)?'Marked complete for today':'Mark complete when you finish this session'}</small></span></label>`}
function sectionCard(id,icon,title,description,tag,action){return `<article class="card"><div class="cardhead"><div class="cardicon">${icon}</div><div><h3>${esc(title)}</h3><p>${esc(description)}</p></div></div><span class="tag ${tag||'cyan'}">${esc(action||'DAILY SESSION')}</span></article>`}
function heroArt(){return `<svg class="hero-art" viewBox="0 0 400 310" role="img" aria-label="Abstract glowing neural network illustration"><defs><radialGradient id="core"><stop stop-color="#d9fff8"/><stop offset=".2" stop-color="#65f0e0"/><stop offset="1" stop-color="#65f0e0" stop-opacity="0"/></radialGradient><linearGradient id="wire"><stop stop-color="#65f0e0" stop-opacity=".1"/><stop offset=".5" stop-color="#a9b8ff" stop-opacity=".85"/><stop offset="1" stop-color="#c09bff" stop-opacity=".1"/></linearGradient></defs><circle cx="205" cy="150" r="122" fill="none" stroke="#80f4e8" stroke-opacity=".13"/><circle cx="205" cy="150" r="90" fill="none" stroke="#8ea7ff" stroke-opacity=".2" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0 205 150" to="360 205 150" dur="42s" repeatCount="indefinite"/></circle><g stroke="url(#wire)" stroke-width="1.5"><path d="M205 150L98 82 55 145 112 220 205 150 295 70 347 145 292 231 205 150 143 45 250 38 347 145 258 278 112 220 55 145 143 45 205 150 250 38" fill="none"/><path d="M98 82L295 70M112 220L292 231M143 45L258 278M55 145L347 145" fill="none" stroke-dasharray="4 7"/></g><g fill="#65f0e0"><circle cx="205" cy="150" r="37" fill="url(#core)"/><circle cx="205" cy="150" r="8"/><circle cx="98" cy="82" r="5"/><circle cx="55" cy="145" r="4"/><circle cx="112" cy="220" r="5"/><circle cx="295" cy="70" r="5"/><circle cx="347" cy="145" r="4"/><circle cx="292" cy="231" r="5"/></g><g fill="#c09bff"><circle cx="143" cy="45" r="4"/><circle cx="250" cy="38" r="4"/><circle cx="258" cy="278" r="4"/></g><circle cx="205" cy="150" r="52" fill="none" stroke="#65f0e0" stroke-opacity=".32"><animate attributeName="r" values="42;57;42" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;.08;.35" dur="4s" repeatCount="indefinite"/></circle></svg>`}
function hero(title,sub,cta='Start today'){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">A YEAR OF COMPOUNDING INTELLIGENCE</div><h1>${title}</h1><p>${sub}</p><div class="hero-actions"><button class="primary" data-go="oi">${esc(cta)} ↗</button><button class="secondary" data-go="progress">View my progress</button></div></div>${heroArt()}</section>`}
function renderHome(){const secs=data?.sections||{};const st=data?.status||{};const ready=Object.keys(secs).length;const total=Object.keys(store.done).length;const completed=Object.values(store.done).reduce((n,x)=>n+Object.values(obj(x)).filter(Boolean).length,0);const updated=text(data?.generated_at);return `${hero('Build your edge.<br><span class="gradient-text">One day at a time.</span>','A guided 365-day journey across biological intelligence, brain-computer interfaces, robotics software, and engineering careers. Designed for curiosity. Built for real-world capability.')}<div class="stats"><div class="stat"><small>CURRICULUM HORIZON</small><strong>365 <span style="font-size:13px;color:var(--cyan)">days</span></strong><span class="trend">Daily progression</span></div><div class="stat"><small>DAILY COMMITMENT</small><strong>120 <span style="font-size:13px;color:var(--cyan)">min</span></strong><span class="trend">Focused learning</span></div><div class="stat"><small>SESSIONS COMPLETED</small><strong>${completed}</strong><span class="trend">Tracked in this browser</span></div><div class="stat"><small>DATA STATUS</small><strong style="font-size:19px">${ready?'Connected':'Offline'}</strong><span class="trend">${ready?'Latest data loaded':'Showing fallback mode'}</span></div></div><div class="sectionhead"><div><div class="eyebrow">YOUR LEARNING ECOSYSTEM</div><h2>Six systems. One future.</h2><p>Pick up where you left off, or explore a new field.</p></div><span class="tag cyan">${esc(dayKey)}</span></div><div class="grid">${sectionCard('oi','◉','Organoid Intelligence','Explore biological computation, neural systems and organoid research.','cyan','30 MIN / DAY')}${sectionCard('bci','⌁','Brain–Computer Interfaces','Follow signals from neural recording to decoding and device control.','gold','30 MIN / DAY')}${sectionCard('gh','⌘','GitHub Robotics Lab','Study real open-source robotics systems and engineering trade-offs.','cyan','15 MIN / DAY')}${sectionCard('li','↗','LinkedIn & Career Intelligence','Build a credible technical profile and communicate your work.','violet','15 MIN / DAY')}${sectionCard('ip','⚙','Internship Academy','Practice embedded, robotics and mechatronics interview skills.','violet','15 MIN / DAY')}${sectionCard('rd','✳','Discovery Center','Scan robotics news and relevant engineering opportunities.','cyan','15 MIN / DAY')}</div><div class="sectionhead"><div><div class="eyebrow">TODAY'S SIGNAL</div><h2>Fresh knowledge, carefully labelled.</h2><p>Content status is not the same as factual verification.</p></div></div><div class="grid"><article class="card"><div class="cardhead"><div class="cardicon">◉</div><div><h3>Organoid Intelligence</h3><p>${esc(text(secs.oi_lesson?.next_lesson)||'Your next lesson is ready to explore.')}</p></div></div><p>${esc(text(secs.oi_lesson?.objective)||'Learn how living neural systems can be studied as information-processing systems.')}</p><div class="cardfoot">${confidenceTag(secs.oi_lesson?.confidence)}<button class="smallbtn" data-go="oi">Open lesson →</button></div></article><article class="card"><div class="cardhead"><div class="cardicon">⌁</div><div><h3>BCI Lab</h3><p>${esc(text(secs.bci_lesson?.next_lesson)||'Explore the signal-to-action pipeline.')}</p></div></div><p>${esc(text(secs.bci_lesson?.objective)||'Learn how neural signals are measured and interpreted.')}</p><div class="cardfoot">${confidenceTag(secs.bci_lesson?.confidence)}<button class="smallbtn" data-go="bci">Open lesson →</button></div></article></div><div class="footnote">Last data build: ${esc(updated||'not supplied by updater')}. Learning completion is saved in this browser and is separate from the daily content generator. ${data?'A section marked “ok” means generation completed; it does not guarantee independent fact-checking.':'Connect to data/latest.json to load the current curriculum.'}</div>`}
function renderLesson(id){const sec=obj(data?.sections?.[id]);const name=id==='oi_lesson'?'Organoid Intelligence':id==='bci_lesson'?'Brain–Computer Interfaces':'Learning session';const key=id;const steps=arr(sec.step_by_step);const pre=arr(sec.prerequisites);const mis=arr(sec.misconceptions);const checks=arr(sec.knowledge_check);return `<div class="dailyhead"><div><div class="eyebrow">${esc(name.toUpperCase())} · DAILY SESSION</div><h1>${esc(sec.next_lesson||sec.objective||name)}</h1><p class="muted">${esc(sec.why_it_matters||'Build the foundations, then apply them to a real engineering question.')}</p></div><span class="datebadge">${esc(dayKey)}<br><b>${sectionDone(key)?'✓ Completed':'TODAY'}</b></span></div><div class="two-col"><div><article class="card"><div class="cardhead"><div class="cardicon">${id==='oi_lesson'?'◉':'⌁'}</div><div><h3>Core idea</h3><p>Start with the intuition, then inspect the technical detail.</p></div></div>${field('Objective',sec.objective)}${field('Prerequisites',pre)}${field('Simple explanation',sec.simple_explanation)}${field('Step by step',steps)}${field('Technical depth',sec.technical_depth)}${field('Common misconceptions',mis)}${field('Exercise',sec.exercise)}${field('Summary',sec.summary)}${field('Next lesson',sec.next_lesson)}<div class="cardfoot">${confidenceTag(sec.confidence)}${taskBox(key,'I completed this lesson')}</div></article></div><div><article class="card"><h3>Knowledge check</h3><p class="muted tiny">Try answering before revealing the model answer.</p>${checks.map((q,i)=>`<details class="qa"><summary>${i+1}. ${esc(q.question||'Review question')}</summary><div class="answer">${esc(q.answer||'Answer not supplied.')}</div></details>`).join('')||'<div class="empty">No knowledge checks were included in this build.</div>'}</article><article class="card" style="margin-top:14px"><h3>Learning notes</h3><p class="muted tiny">Private to this browser. Add questions, insights or follow-ups.</p><textarea class="search" style="width:100%;min-height:150px;resize:vertical" data-note="${id}" placeholder="What surprised you? What do you want to test?">${esc(store.notes[id]||'')}</textarea><div class="cardfoot"><span class="muted tiny">Auto-saved on change</span><button class="smallbtn" data-export-note="${id}">Export note ↗</button></div></article></div></div>`}
function renderPaper(id){const s=obj(data?.sections?.[id]);const title=text(s.paper)||'Research paper not available';return `<div class="sectionhead"><div><div class="eyebrow">RESEARCH READING ROOM</div><h2>${esc(title)}</h2><p>Read claims against the source. Separate paper metadata from interpretation.</p></div>${confidenceTag(s.confidence||s.access_level)}</div><article class="card"><div class="feedmeta"><span class="tag violet">DAY ${esc(s.day||'1')}</span><span class="tag">DOI ${esc(s.doi||'not supplied')}</span></div>${field('Focus',s.focus)}${field('Explanation',s.explanation)}${field('Limitations',s.limits)}${field('Evidence status',s.access_level)}<div class="cardfoot"><a class="paperlink" href="${esc(safeUrl(s.doi_link))}" target="_blank" rel="noopener noreferrer">Open DOI record ↗</a>${taskBox(id,'I reviewed this paper session')}</div></article><div class="notice">Research summaries are not substitutes for the paper. If the updater says “metadata only” or “abstract unavailable,” treat the explanation as preliminary until you verify it from the publisher or a trusted database.</div>`}
function renderGithub(){const s=obj(data?.sections?.github);const meta=obj(s.verified_metadata);return `<div class="dailyhead"><div><div class="eyebrow">OPEN SOURCE ENGINEERING</div><h1>${esc(s.project_name||s.project||'GitHub Robotics Lab')}</h1><p class="muted">Study a real robotics codebase in small, purposeful steps.</p></div><span class="datebadge">${esc(s.day||'Project study')}</span></div><article class="card">${field('Project purpose',s.project_purpose||s.project_summary||s.what_it_does)}${field('Beginner explanation',s.beginner_explanation||s.project_summary||s.goal)}${field('Daily challenge',s.daily_challenge||s.beginner_challenge)}${field('How it works',s.how_it_works||s.physics)}${field('Knowledge check',s.knowledge_check)}${meta.full_name?`<div class="contentblock"><h3>Verified repository metadata</h3><p><b>${esc(meta.full_name)}</b><br>${esc(meta.description||'No description returned')}<br>Language: ${esc(meta.language||'Not supplied')} · Last pushed: ${esc(meta.pushed_at||'Not supplied')} · License: ${esc(meta.license||'Not identified')}</p></div>`:''}<div class="cardfoot"><a class="paperlink" href="${esc(safeUrl(s.project_url||s.repository||meta.html_url))}" target="_blank" rel="noopener noreferrer">Open repository ↗</a>${confidenceTag(s.confidence)}${taskBox('github','I completed the GitHub lab')}</div></article>`}
function renderPractice(id){const s=obj(data?.sections?.[id]);const title=id==='internship'?'Internship Academy':'LinkedIn & Career Intelligence';return `<div class="dailyhead"><div><div class="eyebrow">${id==='internship'?'CAREER READINESS':'TECHNICAL STORYTELLING'}</div><h1>${esc(s.topic||title)}</h1><p class="muted">Turn technical knowledge into proof of skill, without exaggerating experience.</p></div><span class="datebadge">15 min<br><b>DAILY PRACTICE</b></span></div><article class="card">${field('Why this matters',s.why_it_works)}${field('Explanation',s.explanation)}${field('Practical example',s.practical_example||s.example)}${field('Your exercise',s.exercise)}<details class="qa"><summary>Reveal example answer</summary><div class="answer">${esc(typeof s.model_answer==='string'?s.model_answer:JSON.stringify(s.model_answer||'No model answer supplied.',null,2))}</div></details>${field('Improvement tip',s.improvement_tip||s.tip)}<div class="cardfoot">${confidenceTag(s.confidence)}${taskBox(id,'I completed this practice')}</div></article>`}
function renderNews(){const items=arr(data?.sections?.news?.items);return `<div class="sectionhead"><div><div class="eyebrow">ROBOTICS RADAR</div><h2>Discovery Center</h2><p>Industry moves, research, open source and product developments.</p></div><span class="tag cyan">${items.length} stories</span></div>${items.length?`<div class="itemlist">${items.map((x,i)=>`<article class="feeditem"><div class="feedmeta"><span class="tag cyan">${esc(x.category||'Robotics')}</span><span class="tag">${esc(x.published||'Date unavailable')}</span><span class="muted tiny">${esc(x.source||'Source not supplied')}</span></div><h3>${esc(x.title||x.what||'Robotics story')}</h3><p>${esc(x.what||'No summary supplied.')}</p><div class="feedgrid"><div><strong>Who</strong>${esc(x.who||'Not stated in source excerpt')}</div><div><strong>Why it matters</strong>${esc(x.why||x.learn||'Not stated in source excerpt')}</div><div><strong>How</strong>${esc(x.how||'Not stated in source excerpt')}</div><div><strong>Limits</strong>${esc(x.limits||'Not stated in source excerpt')}</div></div><div class="cardfoot">${confidenceTag(x.confidence)}<a class="outlink" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">Read original ↗</a><button class="smallbtn" data-save-url="${esc(safeUrl(x.url))}" data-save-title="${esc(x.title||x.what||'Robotics story')}">${store.saved.some(a=>a.url===safeUrl(x.url))?'★ Saved':'☆ Save story'}</button></div></article>`).join('')}</div>`:'<div class="empty"><strong>No fresh stories in this data build.</strong>The updater keeps previous good content if feeds fail. Try again after the next successful scheduled run.</div>'}<div class="sectionhead"><div><h2>Engineering opportunities</h2><p>Listings are leads, not guarantees. Confirm availability and eligibility on the employer site.</p></div></div>${renderJobs()}`}
function renderJobs(){const items=arr(data?.sections?.jobs?.items);return items.length?`<div class="grid">${items.map(j=>`<article class="card"><div class="cardhead"><div class="cardicon">⚙</div><div><h3>${esc(j.title||'Engineering opportunity')}</h3><p>${esc(j.company||'Company not supplied')} · ${esc(j.location||'Location not supplied')}</p></div></div><div class="feedmeta"><span class="tag">${esc(j.published||'Date unavailable')}</span><span class="tag cyan">${esc(j.source||'Source not supplied')}</span></div><p style="margin-top:12px">${esc(j.type||'Availability not independently verified')}</p><div class="cardfoot"><a class="outlink" href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener noreferrer">View listing ↗</a></div></article>`).join('')}</div>`:'<div class="empty"><strong>No matching listings in this update.</strong>Try again after the next update. Never assume a listing is still open without checking the employer’s page.</div>'}
function renderCareers(){return `<div class="sectionhead"><div><div class="eyebrow">CAREER INTELLIGENCE</div><h2>Build a credible professional signal</h2><p>LinkedIn practice plus the current engineering opportunity feed.</p></div></div>${renderPractice('linkedin')}<div class="sectionhead"><div><h2>Relevant jobs & internships</h2><p>Includes internship, fresher/graduate and suitable experienced roles when available.</p></div></div>${renderJobs()}`}
function renderProgress(){const done=completedCount();const recent=Object.keys(store.done).sort().reverse().slice(0,14);return `<div class="sectionhead"><div><div class="eyebrow">YOUR PERSONAL DASHBOARD</div><h2>Progress & notes</h2><p>Completion is stored locally in this browser, not in GitHub.</p></div><button class="secondary" id="exportData">Export my data ↗</button></div><div class="grid"><article class="card"><div class="completion"><div class="ring" style="--pct:${Math.min(100,done/365*100)}%"><span>${Math.round(done/365*100)}%</span></div><div><h3>365-day horizon</h3><p class="muted tiny">${done} completion marks across saved dates. This is a habit tracker, not a certification.</p></div></div><div class="progressline" style="margin-top:15px"><span style="width:${Math.min(100,done/365*100)}%"></span></div></article><article class="card"><h3>Saved stories</h3><p class="muted tiny">${store.saved.length} items saved in this browser.</p>${store.saved.length?store.saved.map(x=>`<p><a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a> <button class="smallbtn" data-unsave="${esc(x.url)}">Remove</button></p>`).join(''):'<p class="muted">Save a news item from the Discovery Center to collect it here.</p>'}</article></div><div class="sectionhead"><div><h2>Recent activity</h2><p>Check your learning streak without pressure to be perfect.</p></div></div><div class="grid">${recent.map(day=>{const vals=obj(store.done[day]);const n=Object.values(vals).filter(Boolean).length;return `<article class="card"><div class="cardhead"><div class="cardicon">${n?'✓':'·'}</div><div><h3>${esc(day)}</h3><p>${n} sessions completed</p></div></div><div class="progressline"><span style="width:${Math.min(100,n/6*100)}%"></span></div></article>`}).join('')||'<div class="empty">Your completed sessions will appear here.</div>'}</div><div class="sectionhead"><div><h2>All notes</h2><p>Saved on this browser only.</p></div></div>${Object.entries(store.notes).filter(([,v])=>text(v).trim()).map(([k,v])=>`<article class="card" style="margin-bottom:10px"><h3>${esc(LABELS[k]||k)}</h3><p>${esc(v)}</p></article>`).join('')||'<div class="empty">No notes yet. Add notes inside any lesson.</div>'}<div class="notice">Clearing browser data may remove your progress and notes. Use “Export my data” to keep a backup. The automated daily content generator and your personal completion tracker are separate systems.</div>`}
function render(){const m=$('#main');if(!m)return;const s=obj(data?.sections);let out='';if(current==='home')out=renderHome();else if(current==='oi')out=`<div class="sectionhead"><div><div class="eyebrow">BIOLOGICAL COMPUTING</div><h2>Organoid Intelligence</h2><p>From cellular foundations to evidence-led experimental design.</p></div></div>${renderLesson('oi_lesson')}<div class="sectionhead"><div><h2>Research paper investigation</h2><p>Five-step reading sequence, with evidence limitations made explicit.</p></div></div>${renderPaper('oi_paper')}`;else if(current==='bci')out=`<div class="sectionhead"><div><div class="eyebrow">NEURAL SIGNALS → DIGITAL CONTROL</div><h2>Brain–Computer Interfaces</h2><p>Signal acquisition, processing, decoding, feedback and responsible design.</p></div></div>${renderLesson('bci_lesson')}<div class="sectionhead"><div><h2>Research paper investigation</h2><p>Understand the claim, method, evidence and limitations.</p></div></div>${renderPaper('bci_paper')}`;else if(current==='gh')out=renderGithub();else if(current==='li')out=renderCareers();else if(current==='ip')out=renderPractice('internship');else if(current==='rd')out=renderNews();else out=renderProgress();m.innerHTML=out;bind();}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));document.querySelectorAll('[data-complete]').forEach(el=>el.addEventListener('change',()=>setDone(el.dataset.complete,el.checked)));document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{store.notes[el.dataset.note]=el.value;persist()}));document.querySelectorAll('[data-export-note]').forEach(b=>b.addEventListener('click',()=>download(`${b.dataset.exportNote}-notes.txt`,store.notes[b.dataset.exportNote]||'')));document.querySelectorAll('[data-save-url]').forEach(b=>b.addEventListener('click',()=>{const url=safeUrl(b.dataset.saveUrl);if(!url||url==='#')return;const i=store.saved.findIndex(x=>x.url===url);if(i>=0)store.saved.splice(i,1);else store.saved.push({url,title:b.dataset.saveTitle||url});persist();render();showToast(i>=0?'Removed saved story':'Story saved to Progress & Notes')}));document.querySelectorAll('[data-unsave]').forEach(b=>b.addEventListener('click',()=>{store.saved=store.saved.filter(x=>x.url!==b.dataset.unsave);persist();render()}));$('#exportData')?.addEventListener('click',()=>download('nexus-personal-data.json',JSON.stringify({exported_at:new Date().toISOString(),store},null,2)));}
function download(name,content){const blob=new Blob([content],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function loadData(){const status=$('#syncstatus');status.textContent='Syncing latest data…';try{const res=await fetch(`data/latest.json?ts=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const next=await res.json();if(!next||typeof next!=='object'||!next.sections||typeof next.sections!=='object')throw new Error('The JSON file does not contain a sections object');data=next;status.textContent=`Data synced · ${next.date||'date unavailable'}`;if(!Object.keys(data.sections).length)throw new Error('No content sections were returned');}catch(e){status.textContent='Using built-in fallback';data={date:null,generated_at:null,status:{},sections:{oi_lesson:{objective:'Understand intelligence and learning in biological systems.',simple_explanation:'Biological learning involves changes in response to experience. Treat claims about organoid intelligence carefully and look for experimental evidence.',next_lesson:'Start with cell and neuron foundations.',exercise:'Write one testable question about how neural activity could be measured.',confidence:'Starter content; verify with sources'},bci_lesson:{objective:'Understand the signal-to-command loop of a BCI.',simple_explanation:'A BCI records brain activity, processes signals and maps patterns to a defined output. It does not read arbitrary thoughts.',next_lesson:'Learn how EEG signals are acquired.',exercise:'Draw a signal acquisition, processing, decoding and output diagram.',confidence:'Starter content; verify with sources'},oi_paper:{paper:'Research paper not loaded',focus:'Find a primary paper and read its abstract before trusting a summary.',confidence:'Not loaded'},bci_paper:{paper:'Research paper not loaded',focus:'Find a primary paper and read its abstract before trusting a summary.',confidence:'Not loaded'},github:{project_name:'ROS 2 Navigation (Nav2)',project_url:'https://github.com/ros-navigation/navigation2',project_purpose:'Explore an open-source robotics navigation framework.',confidence:'Starter content; verify repository metadata'},internship:{topic:'Analyze an embedded-systems internship',explanation:'Identify required languages, microcontrollers, interfaces and tools in a real listing.',exercise:'Find an internship posting and list its top five technical requirements.',confidence:'Starter practice'},linkedin:{topic:'Write an honest technical headline',explanation:'Describe your student status, technical focus and goal without claiming skills you cannot demonstrate.',exercise:'Draft three headline options using evidence from your projects.',confidence:'Starter practice'},news:{items:[]},jobs:{items:[]}}};showToast('Could not load latest.json. Showing safe starter content.')}navRender();render()}
$('#refreshBtn').addEventListener('click',loadData);$('#continueBtn').addEventListener('click',()=>go('oi'));navRender();loadData();
})();
</script></body></html>
