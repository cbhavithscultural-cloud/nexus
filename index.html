<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Nexus — Living Intelligence Academy</title>
<style>
:root{--bg:#0e1822;--pn:#15232f;--ink:#e8eef2;--mu:#9aabb7;--ln:#2a3d4d;--ac:#4fb3a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#f2f5f6;--pn:#fff;--ink:#13202a;--mu:#52626d;--ln:#c9d5dc;--ac:#14776a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,serif}
h1,h2,h3,button,nav,.s{font-family:system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{border-right:1px solid var(--ln);padding:16px 8px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
nav b{display:block;padding:4px 10px 14px;font-size:1.1rem;letter-spacing:.05em}
nav button{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:none;color:var(--mu);padding:9px 10px;cursor:pointer;font-size:.9rem}
nav button.on{color:var(--ink);border-color:var(--c);background:var(--pn)}
main{padding:22px;max-width:900px}h1{margin:0 0 4px;font-size:1.7rem}h2{font-size:1.1rem;margin:20px 0 6px}
.mu{color:var(--mu)}.s{font-size:.85rem}.p{background:var(--pn);border:1px solid var(--ln);border-top:3px solid var(--c,var(--ac));border-radius:6px;padding:14px 16px;margin:12px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.g .p{margin:0}
button.b{border:1px solid var(--ln);background:none;color:var(--ink);padding:7px 12px;cursor:pointer;margin:3px 4px 3px 0}
button.b:hover,button.b[aria-pressed=true]{border-color:var(--ac);background:var(--ac);color:#0b1519}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea,input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--ln);padding:8px;font:inherit}
.bar{height:6px;background:var(--ln)}.bar i{display:block;height:100%;background:var(--ac)}
.f{margin:8px 0}.f>b{display:block;font-family:system-ui,sans-serif;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}.f p{margin:2px 0}.f ul{margin:2px 0;padding-left:20px}.sub{border-left:2px solid var(--ln);padding-left:10px;margin:6px 0}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:12px;padding:1px 9px;font:.78rem system-ui;color:var(--mu)}
.tl{display:flex;gap:6px;margin:8px 0}.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;font:.8rem system-ui;color:var(--mu)}.dot.on{background:var(--ac);color:#0b1519;border-color:var(--ac)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:14px}.hero svg{width:100%;height:auto}.hero h1{font-size:2.3rem;line-height:1.1}
.pulse{animation:pl 3s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}
a{color:var(--ac)}details>summary{cursor:pointer;font-family:system-ui}
@media(max-width:700px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow-x:auto;border:0;border-bottom:1px solid var(--ln);padding:6px}nav b{display:none}nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--c)}.hero{grid-template-columns:1fr}.hero h1{font-size:1.8rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap"><nav id="nav" aria-label="Departments"></nav><main id="m">Loading…</main></div>
<script>
const DEP=[["home","Mission Control","#4fb3a6",0],["oi","Organoid Intelligence","#4fb3a6",30],["bci","Brain-Computer Interface","#e3b04b",30],["gh","GitHub Robotics Lab","#7aa7e0",15],["li","LinkedIn & Careers","#d9788a",15],["ip","Internship Academy","#b79be0",15],["rd","Discovery Center","#8fcf7a",15],["pg","Progress & System","#9aabb7",0]];
const SEC={oi:["oi_lesson","oi_paper"],bci:["bci_lesson","bci_paper"],gh:["github"],li:["linkedin","jobs"],ip:["internship"],rd:["news"]};
const TT={oi_lesson:"Today's lesson",bci_lesson:"Today's lesson",oi_paper:"Research paper investigation",bci_paper:"Research paper investigation",github:"Project investigation",linkedin:"LinkedIn improvement",jobs:"Opportunities & hiring intelligence",internship:"Today's practice",news:"Verified robotics developments"};
const LB={done:"Completed",part:"Partly done",skip:"Skipped",post:"Postponed"};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const Lb=k=>k.replace(/_/g," ");
let S={d:{},nt:{},sv:[],ap:[]};try{S=Object.assign(S,JSON.parse(localStorage.getItem("nx2")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("nx2",JSON.stringify(S))}catch(e){}};
const today=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});S.d[today]=S.d[today]||{};
let DATA=null,cur="home",rev={},F="All";
const SEED={
oi_lesson:{objective:"Explain what a neuron is and what its parts do.",why_it_matters:"Organoid Intelligence uses living neurons as its computing material, so you need to know what one is and does.",prerequisites:["None. This is the first lesson."],simple_explanation:"A neuron is a cell that listens through its branches (dendrites), decides in its cell body, and sends a message down one long wire (the axon) to its neighbours. Neurons connect at synapses. A human brain has roughly 86 billion neurons. A thought is not stored in one cell: patterns of activity across many connected neurons carry information.",technical_depth:"Compare with a software neuron, which multiplies inputs by weights and sums them. A biological neuron loosely does this too, but timing, chemistry and cell shape matter, so the analogy is only a starting point.",misconceptions:["A neuron is not a tiny computer chip.","One neuron does not hold one memory."],knowledge_check:[{question:"Which part of a neuron usually receives incoming signals?",answer:"The dendrites."},{question:"What is a synapse?",answer:"The junction where one neuron passes a signal to another cell."}],exercise:"Draw a neuron and label dendrites, cell body, axon and synapse from memory.",summary:"A neuron receives, decides, and sends. Many connected neurons together carry information.",next_lesson:"How neurons signal: resting voltage and the action potential.",confidence:"Starter lesson written by Claude from general knowledge"},
bci_lesson:{objective:"Describe the basic loop of a brain-computer interface.",why_it_matters:"BCI is the bridge between neural activity and machines.",prerequisites:["Idea that the brain produces electrical activity."],simple_explanation:"A BCI measures brain activity, turns it into commands, and uses the commands to control something such as a cursor or robot arm. A BCI reads specific signal patterns it was trained for, per person. It does not read thoughts in general.",step_by_step:["Record signals from the brain.","Clean the signals and extract features.","Decode intent with a model.","Control a device.","Give feedback so the user can adjust."],technical_depth:"Wolpaw et al. (2002) described the standard framework of signal acquisition, feature extraction, translation and output.",misconceptions:["BCIs do not read private thoughts.","Most BCIs are not implanted; many use scalp EEG."],knowledge_check:[{question:"Name the five parts of the BCI loop.",answer:"Record, process, decode, act on a device, give feedback."},{question:"Can a BCI read any thought?",answer:"No. It decodes only patterns it was trained for."}],exercise:"Sketch the loop for a person moving a cursor with imagined hand movement.",summary:"Record, process, decode, act, feedback.",next_lesson:"EEG basics: how scalp electrodes record brain activity.",confidence:"Starter lesson written by Claude from general knowledge"},
oi_paper:{paper:"Cerebral organoids model human brain development and microcephaly (Lancaster et al., Nature, 2013)",day:"1 of 5",doi:"10.1038/nature12517",doi_link:"https://doi.org/10.1038/nature12517",focus:"Why this research exists",explanation:"Scientists wanted a better way to study how the human brain develops. Animal models do not always match human development. The researchers grew three-dimensional tissue from stem cells that forms brain-like regions, and used it to model microcephaly, a condition where the brain is much smaller than normal.",limits:"Organoids are not brains. They lack blood vessels and sensory input, and vary from batch to batch.",access_level:"Full text NOT read here. Written from general knowledge. Verify against the DOI link.",confidence:"Starter summary, unverified"},
bci_paper:{paper:"Brain-computer interfaces for communication and control (Wolpaw et al., Clinical Neurophysiology, 2002)",day:"1 of 5",doi:"10.1016/S1388-2457(02)00057-3",doi_link:"https://doi.org/10.1016/S1388-2457(02)00057-3",focus:"Why this research exists",explanation:"People with severe motor disabilities can lose the ability to move or speak. This paper reviews how a direct pathway from brain signals to a computer could restore communication and control, and sets out a common framework for describing BCIs.",limits:"It is a 2002 review of early work, not a clinical trial result.",access_level:"Full text NOT read here. Written from general knowledge. Verify against the DOI link.",confidence:"Starter summary, unverified"},
github:{project:"Nav2, the ROS 2 navigation stack",day:"1 of 3: understand the project",repository:"https://github.com/ros-navigation/navigation2",what_it_does:"Lets a mobile robot plan a path to a goal and follow it while avoiding obstacles. It combines a map or costmap, a global planner, a local controller and recovery behaviours, wired together with ROS 2 nodes and topics.",physics:"A differential-drive robot sets left and right wheel speeds: forward speed v = (vL + vR) / 2 and turn rate w = (vR - vL) / wheel separation.",note:"I have not run this code. Confirm the link opens and check the licence and last commit before using it.",confidence:"Starter content, unverified"},
linkedin:{topic:"Write your headline",explanation:"Say what you actually do or are learning. Structure: role or student status | skills you have used | what you are exploring. Do not claim anything you cannot back up.",exercise:"Write three headline options and pick the one a recruiter could verify from your profile.",improvement_tip:"Avoid words like passionate or expert. Use specific keywords such as ROS 2, sensors, embedded C.",confidence:"Starter task"},
internship:{topic:"Percentages",explanation:"A percentage means per hundred. To find p% of n, divide p by 100 and multiply by n.",example:"20% of 150 is 0.20 x 150 = 30.",exercise:"What is 15% of 200?",model_answer:"30, because 0.15 x 200 = 30.",improvement_tip:"Find 10% by moving the decimal one place left, then build other percentages from it.",confidence:"Starter task"},
jobs:{items:[],action:"Search LinkedIn Jobs, Internshala and university lab pages for robotics, embedded and BCI internships. Check each posting's date and whether it is still open before applying.",note:"No verified listings are available yet. The nightly update fills this in once its news and job search works."},
news:{items:[{category:"Industry view",title:"Unitree founder expects a robotics breakthrough within one or two years",published:"2026-10-12",source:"South China Morning Post",url:"https://scmp.com/tech/big-tech/article/3370603/openais-gpt-6-may-lead-robotics-breakthrough-soon-next-year-unitree-founder",what:"Unitree CEO Wang Xingxing said OpenAI's GPT-6 raised his expectation of a breakthrough in embodied intelligence.",who:"Wang Xingxing, Unitree Robotics, OpenAI.",how:"Embodied intelligence means AI that senses the world and outputs physical actions, so one robot can handle varied tasks.",why:"It shows how a leading robot maker views the timeline.",limits:"A forecast by a company founder, not an experimental result.",learn:"Study how vision-language-action models map images and text to robot commands.",confidence:"Preliminary (single report, a prediction)"},{category:"Business",title:"Qualcomm listed as acquiring PickNik Robotics",published:"2026-09-30",source:"Robotics 24/7, September recap",url:"https://www.robotics247.com/podcast/september-2026-robotics-recap/flexiv_robotics",what:"A September recap lists Qualcomm's acquisition of PickNik Robotics. No terms were given in the excerpt I read.",who:"Qualcomm, PickNik Robotics.",how:"Background from general knowledge: PickNik is known for MoveIt, open-source software that plans collision-free arm movements.",why:"A chip company buying robot-software expertise suggests interest in the software layer.",limits:"Single recap source. Terms and purpose unconfirmed.",learn:"Try the MoveIt 2 tutorials in simulation and learn inverse kinematics.",confidence:"Preliminary (no primary source seen)"},{category:"Product",title:"Clone Robotics teases a five-finger hand before a November humanoid launch",published:"2026-10-02",source:"RobotCafe, Today in Robotics",url:"https://buttondown.com/robotcafe/archive/today-in-robotics-friday-october-2-2026/",what:"A roundup says Clone Robotics is teasing a human-controlled five-finger hand ahead of a November launch.",who:"Clone Robotics.",how:"Human-controlled means teleoperation: a person's hand movements are measured and copied by the robot hand.",why:"Dexterous hands are becoming a headline feature of new humanoids.",limits:"A teaser. The autonomy claim in the linked video report is unverified.",learn:"Look up the degrees of freedom of a human hand and common grasp types.",confidence:"Uncertain (teaser, unverified claim)"}]}};
function val(v){if(Array.isArray(v))return v.every(x=>typeof x!=="object")?"<ul>"+v.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":v.map(x=>`<div class=sub>${typeof x==="object"?kv(x):val(x)}</div>`).join("");if(v&&typeof v==="object")return `<div class=sub>${kv(v)}</div>`;const s=String(v);return /^https:\/\/\S+$/.test(s)?`<p><a href="${esc(s)}" target=_blank rel="noopener noreferrer">${esc(s)}</a></p>`:`<p>${esc(s)}</p>`}
function kv(o,skip=[]){return Object.entries(o).filter(([k,v])=>v!=null&&v!==""&&!skip.includes(k)&&k!=="stub").map(([k,v])=>`<div class=f><b>${esc(Lb(k))}</b>${val(v)}</div>`).join("")}
function conf(d){return d.confidence?`<span class=chip>Confidence: ${esc(d.confidence)}</span> `:""}
function lesson(d,key){const kc=Array.isArray(d.knowledge_check)?d.knowledge_check:[];const R=rev[key]||(rev[key]=new Set());
 const sec=(t,k)=>d[k]?`<h2>${t}</h2>${val(d[k])}`:"";
 return conf(d)+(d.objective?`<h2>Objective</h2>${val(d.objective)}`:"")+sec("Why it matters","why_it_matters")+sec("Prerequisites","prerequisites")+sec("Explanation","simple_explanation")+sec("Step by step","step_by_step")+(d.technical_depth?`<details><summary>Show the technical details</summary>${val(d.technical_depth)}</details>`:"")+sec("Common misconceptions","misconceptions")+
 (kc.length?`<h2>Knowledge check</h2><p class="mu s">Try to answer in your own words first, then reveal. Completed unlocks after you reveal every answer.</p>`+kc.map((q,i)=>`<div class=f><p><b style="text-transform:none;font-size:1rem;color:inherit">${esc(q.question||"")}</b></p>${R.has(i)?`<p class=sub>${esc(q.answer||"")}</p>`:`<button class=b data-r="${key}|${i}">Show answer</button>`}</div>`).join(""):"")+sec("Exercise","exercise")+sec("Summary","summary")+sec("Next lesson","next_lesson")+
 `<h2>My notes</h2><textarea data-n="${key}" rows=3 placeholder="Write the idea in your own words">${esc(S.nt[key]||"")}</textarea>`+kv(d,["objective","why_it_matters","prerequisites","simple_explanation","step_by_step","technical_depth","misconceptions","knowledge_check","exercise","summary","next_lesson","confidence"])}
function paper(d){const day=parseInt(d.day)||1;return conf(d)+`<h2 style="margin-top:4px">${esc(d.paper||"")}</h2><div class=tl aria-label="Day ${day} of 5">${[1,2,3,4,5].map(i=>`<span class="dot ${i<=day?"on":""}">${i}</span>`).join("")}</div>`+(d.doi_link?`<p><a href="${esc(d.doi_link)}" target=_blank rel="noopener noreferrer">${esc(d.doi_link)}</a></p>`:"")+kv(d,["paper","day","doi","doi_link","confidence"])}
function news(d){const all=d.items||[],key=n=>n.url||n.title,cats=[...new Set(all.map(n=>n.category).filter(Boolean))];const I=all.filter(n=>F==="All"||(F==="Saved"?S.sv.includes(key(n)):n.category===F));const lab=(t,v)=>v?`<p><b>${t}.</b> ${esc(v)}</p>`:"";
return `<p class=mu>Checked ${esc((DATA&&DATA.date)||"")} (IST). ${all.length} dated, linked stories. Coverage is limited to what could be retrieved, so this is not a complete global feed.</p><div>`+["All",...cats,"Saved"].map(c=>`<button class=b aria-pressed=${F===c} data-f="${esc(c)}">${esc(c)}</button>`).join("")+`</div>`+(I.length?I.map(n=>`<article class=p style="--c:#8fcf7a"><h2 style="margin-top:0">${esc(n.title||"")}</h2><div class="mu s">${esc(n.category||"News")} · published ${esc(n.published||"date unknown")} · ${esc(n.source||"")} · <b>${esc(n.confidence||"")}</b></div>`+lab("What happened",n.what)+lab("Who",n.who)+(n.how?`<details><summary>How the technology works</summary><p>${esc(n.how)}</p></details>`:"")+lab("Why it matters",n.why)+lab("Limitations",n.limits)+lab("What to learn",n.learn)+(/^https:\/\//.test(n.url||"")?`<a href="${esc(n.url)}" target=_blank rel="noopener noreferrer">Original source</a> `:"")+`<button class=b data-v="${esc(key(n))}">${S.sv.includes(key(n))?"Saved":"Save"}</button></article>`).join(""):`<div class=p>${F==="Saved"?"Nothing saved yet. Press Save on a story to keep it here.":"No stories in this update."}</div>`)+`<div class="p mu s">Also worth reading directly: IEEE Spectrum Robotics (Video Friday) and The Robot Report. Stories refresh automatically each night. Always open the original source before relying on a claim.</div>`}
function newsPage(){let d=DATA&&DATA.sections&&DATA.sections.news;const st=(DATA&&DATA.status&&DATA.status.news)||"missing";if(!d)return `<p class="mu s">Starter stories from my own search on 2026-10-21. The nightly update has no news yet (latest run: ${esc(String(st).slice(0,100))}) and will replace these automatically.</p>`+news(SEED.news);return(String(st).startsWith("ok")?"":`<p class="mu s">Today's refresh failed, so these are the last good stories. (${esc(String(st).slice(0,120))})</p>`)+news(d)}
function jobs(d){return (d.items||[]).map(j=>`<div class=p style="--c:#d9788a"><b>${esc(j.title||"")}</b> <span class=chip>${esc(j.type||"")}</span><br><span class="mu s">${esc(j.location||"")} · ${esc(j.published||"date unknown")} · ${esc(j.source||"")}</span>`+kv(j,["title","type","location","published","source"])+"</div>").join("")+(d.action?`<div class=p><b>Action for today</b>${val(d.action)}</div>`:"")+(d.note?`<p class="mu s">${esc(d.note)}</p>`:"")}
function card(k,c){let d=DATA&&DATA.sections&&DATA.sections[k],seed=false;const st=(DATA&&DATA.status&&DATA.status[k])||"missing";if(!d&&SEED[k]){d=SEED[k];seed=true}
 let h=`<section class=p style="--c:${c}"><h2 style="margin-top:0">${TT[k]}</h2>`;
 if(!d)return h+`<p class=mu>No content yet. Latest run: ${esc(st)}. The next scheduled update will retry.</p></section>`;
 if(seed)h+=`<p class="mu s">Starter content written by Claude. The nightly update has nothing for this section yet and will replace this automatically. Latest run: ${esc(String(st).slice(0,100))}</p>`;else if(!String(st).startsWith("ok"))h+=`<p class="mu s">Today's refresh failed, so this is the last good content. (${esc(String(st).slice(0,120))})</p>`;
 if(d.note)h+=`<p class="mu s">${esc(d.note)}</p>`;
 if(k.endsWith("_lesson"))h+=lesson(d,k);else if(k.endsWith("_paper"))h+=paper(d);else if(k==="news")h+=news(d);else if(k==="jobs")h+=jobs(d);else h+=conf(d)+kv(d,["confidence","note"]);return h+"</section>"}
function status(k,c){const T=S.d[today];return `<div class=p style="--c:${c}"><b>Record today's session</b><div id=st>`+Object.entries(LB).map(([s,l])=>`<button class=b data-s="${k}|${s}" aria-pressed=${T[k]===s}>${l}</button>`).join("")+`</div><p id=fb class="s mu">Completed needs every knowledge-check answer revealed. Opening a lesson never counts as learning.</p></div>`}
function aptitude(){return `<div class=p style="--c:#b79be0"><h2 style="margin-top:0">Aptitude: percentages</h2><div id=aq></div></div>`}
let q,t0;function newQ(){const p=[10,15,20,25,40,50][Math.random()*6|0],n=[40,80,120,200,360][Math.random()*5|0];q={t:`What is ${p}% of ${n}?`,a:p*n/100};t0=Date.now()}
function apt(){if(!q)newQ();const A=S.ap,c=A.filter(x=>x.ok).length;$("#aq").innerHTML=`<p><b>${q.t}</b></p><input id=an type=number step=any aria-label=Answer><button class=b id=sb>Check</button><p id=r class=s></p><p class="mu s">Attempts ${A.length} · accuracy ${A.length?Math.round(c/A.length*100):0}%</p>`;$("#sb").onclick=()=>{const v=parseFloat($("#an").value);if(isNaN(v))return;const ok=Math.abs(v-q.a)<1e-6;S.ap.push({ok,s:(Date.now()-t0)/1000});sv();$("#r").textContent=ok?"Correct.":"Answer was "+q.a;setTimeout(()=>{newQ();apt()},1200)}}
function streak(){let n=0,d=new Date(today);for(;;){const k=d.toISOString().slice(0,10),x=S.d[k];if(x&&Object.values(x).includes("done")){n++;d.setDate(d.getDate()-1)}else if(k===today)d.setDate(d.getDate()-1);else break}return n}
function nav(){$("#nav").innerHTML="<b>NEXUS</b>";DEP.forEach(([k,n,c])=>{const b=document.createElement("button");b.textContent=n;b.style.setProperty("--c",c);if(k===cur)b.className="on";b.onclick=()=>{cur=k;draw()};$("#nav").append(b)})}
function home(){const T=S.d[today],P=DEP.filter(d=>d[3]);let mins=0;P.forEach(d=>{if(T[d[0]]==="done")mins+=d[3];else if(T[d[0]]==="part")mins+=d[3]/2});const nx=P.find(d=>!T[d[0]]);const pos=[[60,40],[240,40],[40,120],[260,120],[90,180],[210,180]];
 return `<div class=hero><div><h1>Your personal research academy</h1><p class=mu>${today} (IST). Content refreshes automatically every night. Each node lights up when you complete that department's session.</p></div><svg viewBox="0 0 300 200" role=img aria-label="Six department nodes"><path stroke="var(--ln)" stroke-width=1.5 d="M150 100L60 40M150 100L240 40M150 100L40 120M150 100L260 120M150 100L90 180M150 100L210 180"/><circle cx=150 cy=100 r=14 fill="var(--ac)" class=pulse />${P.map((d,i)=>`<circle cx=${pos[i][0]} cy=${pos[i][1]} r=11 fill="${d[2]}" opacity=${T[d[0]]==="done"?1:.4} />`).join("")}</svg></div><div class=bar style="margin-top:14px"><i style="width:${mins/120*100}%"></i></div><p class=s>${mins} of 120 minutes · streak ${streak()} days · data updated ${DATA?esc(DATA.generated_at||"never"):"not loaded"}</p><h2>Next action</h2><div class=p>${nx?`Start <b>${nx[1]}</b> (${nx[3]} min)<br><button class=b data-g=${nx[0]}>Open</button>`:"All six sessions recorded today."}</div><h2>Search</h2><input id=sq placeholder="Search lessons, papers, news" aria-label=Search><div id=sr></div><h2>Today's plan</h2><div class=g>${P.map(d=>`<div class=p style="--c:${d[2]}"><b>${d[1]}</b><br><span class=mu>${d[3]} min · ${T[d[0]]?LB[T[d[0]]]:"Not started"}</span><br><button class=b data-g=${d[0]}>Open</button></div>`).join("")}</div>`}
function pg(){const st=DATA&&DATA.status||{},done=Object.keys(S.d).reduce((a,k)=>a+Object.values(S.d[k]).filter(v=>v==="done").length,0);
 return `<h1>Progress & System</h1><p>${done} sessions completed · ${Object.keys(S.d).length} active days · streak ${streak()} · ${S.ap.length} aptitude attempts</p><h2>Automation status</h2><div class=p>${DATA?`Last update: ${esc(DATA.generated_at||"never")}<br>`:"No data loaded.<br>"}`+Object.entries(st).map(([k,v])=>`<div class=s><b>${esc(TT[k]||k)}</b>: <span class="${String(v).startsWith("ok")?"":"mu"}">${esc(String(v).slice(0,200))}</span></div>`).join("")+`</div><p class="mu s">The job runs at about 02:00 IST on GitHub. Progress is saved in this browser only.</p><button class=b id=rs>Delete all my data</button>`}
function dept(k){const c=DEP.find(d=>d[0]===k);if(k==="rd")return `<h1>${c[1]}</h1>`+newsPage()+status(k,c[2]);return `<h1>${c[1]}</h1><p class=mu>${c[3]} minutes a day. Updated automatically each night.</p>`+SEC[k].map(s=>card(s,c[2])).join("")+(k==="ip"?aptitude():"")+status(k,c[2])}
function draw(){nav();let h;if(cur==="home")h=home();else if(cur==="pg")h=pg();else h=dept(cur);$("#m").innerHTML=h;if(cur==="ip")apt();window.scrollTo(0,0)}
$("#m").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const D=t.dataset;
 if(D.g){cur=D.g;draw()}
 else if(D.r){const[k,i]=D.r.split("|");(rev[k]=rev[k]||new Set()).add(+i);const y=scrollY;draw();scrollTo(0,y)}
 else if(D.f){F=D.f;const y=scrollY;draw();scrollTo(0,y)}
 else if(D.v){S.sv=S.sv.includes(D.v)?S.sv.filter(x=>x!==D.v):S.sv.concat(D.v);sv();const y=scrollY;draw();scrollTo(0,y)}
 else if(D.s){const[k,s]=D.s.split("|");if(s==="done"){const need=SEC[k].filter(x=>x.endsWith("_lesson")).some(x=>{const kc=(((DATA||{}).sections||{})[x]||{}).knowledge_check||[];return kc.length&&(rev[x]||new Set()).size<kc.length});if(need){$("#fb").textContent="Reveal every knowledge-check answer first, then mark completed.";return}}
  S.d[today][k]=S.d[today][k]===s?undefined:s;sv();const y=scrollY;draw();scrollTo(0,y)}
 else if(t.id==="rs"&&confirm("Delete all progress?")){S={d:{},nt:{},sv:[],ap:[]};try{localStorage.removeItem("nx2")}catch(x){}location.reload()}});
$("#m").addEventListener("input",e=>{const t=e.target;if(t.dataset.n){S.nt[t.dataset.n]=t.value;sv()}
 if(t.id==="sq"){const v=t.value.toLowerCase().trim(),R=[];if(v.length>1&&DATA&&DATA.sections)for(const d of DP())for(const k of SEC[d[0]]){const x=DATA.sections[k];if(x&&JSON.stringify(x).toLowerCase().includes(v))R.push([d[0],d[1],TT[k]])}
  $("#sr").innerHTML=v.length>1?(R.length?R.map(r=>`<div class=p><span class="mu s">${esc(r[1])}</span> ${esc(r[2])} <button class=b data-g=${r[0]}>Open</button></div>`).join(""):"<p class=mu>No matches.</p>"):""}});
const DP=()=>DEP.filter(d=>d[3]);
fetch("data/latest.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{DATA=d;draw()}).catch(()=>{draw();$("#m").insertAdjacentHTML("afterbegin",`<div class="p mu">No data published yet. Run the daily-update workflow once.</div>`)});
</script></body></html>
